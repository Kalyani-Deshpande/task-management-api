services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5435:5432'
    volumes:
      - taskdb_pgdata:/var/lib/postgresql/data

  task-management-api:
    build: .
    ports:
      - '5000:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=taskdb;Username=postgres;Password=postgres"
      Jwt__Key: "your-super-secret-jwt-key-minimum-32-characters-long"
      Jwt__Issuer: "task-management-api"
      Jwt__Audience: "task-management-api-users"
    depends_on:
      - postgres

volumes:
  taskdb_pgdata: